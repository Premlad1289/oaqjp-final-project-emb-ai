<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emotion Detector</title>
</head>
<body>
    <h1>Emotion Detector</h1>
    <p>Enter text below to analyze its emotion:</p>
    <input type="text" id="textToAnalyze" placeholder="Type here...">
    <button onclick="analyzeEmotion()">Analyze</button>
    <p id="system_response"></p>

    <script>
        function analyzeEmotion() {
            const text = document.getElementById("textToAnalyze").value;
            const xhttp = new XMLHttpRequest();
            xhttp.onreadystatechange = function() {
                if (this.readyState == 4) {
                    document.getElementById("system_response").innerHTML = this.responseText;
                }
            };
            xhttp.open("GET", "/emotionDetector?textToAnalyze=" + encodeURIComponent(text), true);
            xhttp.send();
        }
    </script>
</body>
</html>
